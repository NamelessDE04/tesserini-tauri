name: Pubblica versione web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pubblica la cartella web nel ramo gh-pages
        run: |
          cp -r web /tmp/site
          touch /tmp/site/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf -q .
          git clean -fdxq
          cp -r /tmp/site/. .
          git add -A
          git commit -q -m "Versione web ${{ github.run_number }}"
          git push -f origin gh-pages
