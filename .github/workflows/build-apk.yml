name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Caratteri offline
        run: bash scripts/fetch-fonts.sh

      - name: Compila APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rinomina
        run: cp app/build/outputs/apk/release/app-release.apk TesseriniTauri.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TesseriniTauri-apk
          path: TesseriniTauri.apk
          retention-days: 30
