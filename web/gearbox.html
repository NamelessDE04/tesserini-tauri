<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101318">
<title>Gearbox V2 in 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #101318; overflow: hidden; color: #eef4fb; font: 14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .pan { position: fixed; left: 12px; right: 12px; background: #171c22e6; border: 1px solid #39434d; border-radius: 12px; padding: 10px 12px; z-index: 2; }
  #top { top: max(12px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; }
  #top b { letter-spacing: .08em; flex: 1; }
  #bot { bottom: max(12px, env(safe-area-inset-bottom)); }
  #fase { font-weight: 700; min-height: 2.6em; color: #ffd27a; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .row input { flex: 1; }
  button { background: #2a333d; color: #eef4fb; border: 1px solid #4a5662; border-radius: 8px; padding: 8px 12px; font: inherit; min-height: 40px; cursor: pointer; }
  small { opacity: .65; }
  #err { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  @media (min-width: 700px) { .pan { right: auto; width: 360px; } }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/" } }</script>
</head>
<body>
<canvas id="gearbox"></canvas>
<div class="pan" id="top"><button id="indietro" type="button">‹ Torna</button><b>GEARBOX V2 · SPACCATO</b></div>
<div class="pan" id="bot">
  <div id="fase">&nbsp;</div>
  <div class="row"><button id="play" type="button">Pausa</button><label style="flex:1;display:flex;gap:8px;align-items:center">Velocità <input id="speed" type="range" min=".2" max="2" step=".1" value=".6"></label></div>
  <div class="row"><span>Ciclo</span><input id="phase" type="range" min="0" max="1" step=".001" value="0"></div>
  <small>Trascina per ruotare · pizzica o rotella per lo zoom</small>
</div>
<div id="err">Questo dispositivo non riesce a mostrare la grafica 3D.</div>

<script>
  document.getElementById('indietro').onclick = function () { if (history.length > 1) history.back(); else location.href = './'; };
</script>
<script type="module">
// Animazione dimostrativa di un gearbox V2 (forme semplificate, non in scala).
// Base fornita dall'utente; adattata: ciclo realistico (carica lenta, rilascio rapido),
// molla ancorata al guidamolla, uscita del pallino, descrizione delle fasi in italiano.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';

const canvas = document.querySelector('#gearbox');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }

const scene = new THREE.Scene();
scene.background = new THREE.Color('#101318');
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(1.6, 0, 0);
controls.minDistance = 3;
controls.maxDistance = 30;

scene.add(new THREE.HemisphereLight(0xb8d0e8, 0x242830, 2.1));
const key = new THREE.DirectionalLight(0xffffff, 3); key.position.set(4, 6, 5); key.castShadow = true; scene.add(key);
const rim = new THREE.DirectionalLight(0x5b9bff, 1.4); rim.position.set(-5, 2, -4); scene.add(rim);

const mat = (color, metalness = 0.55, roughness = 0.34) => new THREE.MeshStandardMaterial({ color, metalness, roughness });
const shellMat = new THREE.MeshStandardMaterial({ color: '#63717f', metalness: 0.65, roughness: 0.28, transparent: true, opacity: 0.18, depthWrite: false });
const steel = mat('#aeb9c4', 0.8, 0.25), darkSteel = mat('#45515d', 0.75, 0.3), brass = mat('#c7a45b', 0.7, 0.27);
const blue = mat('#54a9d8', 0.45, 0.28), orange = mat('#e58b48', 0.45, 0.3), black = mat('#20262d', 0.35, 0.5);
const cylGlass = new THREE.MeshStandardMaterial({ color: '#aeb9c4', metalness: 0.5, roughness: 0.2, transparent: true, opacity: 0.35, depthWrite: false });

function box(parent, size, material, position) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(...size), material);
  m.position.set(...position); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function cylinder(parent, radius, depth, material, position, axis = 'z', segments = 48) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, depth, segments), material);
  if (axis === 'z') m.rotation.x = Math.PI / 2;
  if (axis === 'x') m.rotation.z = Math.PI / 2;
  m.position.set(...position); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}

const gearbox = new THREE.Group(); scene.add(gearbox);

// guscio in sezione
box(gearbox, [5.2, 0.18, 1.25], shellMat, [0, -0.92, 0]);
box(gearbox, [5.2, 0.18, 1.25], shellMat, [0, 0.92, 0]);
box(gearbox, [0.16, 1.75, 1.25], shellMat, [-2.52, 0, 0]);
box(gearbox, [0.16, 1.75, 1.25], shellMat, [2.52, 0, 0]);

// cilindro (trasparente per vedere il pistone), testa e nozzle
cylinder(gearbox, 0.34, 2.15, cylGlass, [0.92, 0.38, 0], 'x');
cylinder(gearbox, 0.39, 0.18, darkSteel, [2.03, 0.38, 0], 'x');
const nozzle = box(gearbox, [0.48, 0.12, 0.12], blue, [2.35, 0.38, 0]);

// camera hop-up, canna e pallino
box(gearbox, [0.36, 0.4, 0.4], black, [2.8, 0.38, 0]);
cylinder(gearbox, 0.07, 3.2, steel, [4.6, 0.38, 0], 'x', 24);
const bb = new THREE.Mesh(new THREE.SphereGeometry(0.075, 24, 16), mat('#f4f4f0', 0.05, 0.35));
bb.castShadow = true; gearbox.add(bb);

// pistone con cremagliera
const piston = new THREE.Group(); gearbox.add(piston);
box(piston, [1.2, 0.25, 0.48], orange, [0.38, 0.38, 0]);
box(piston, [0.16, 0.42, 0.52], steel, [1.02, 0.38, 0]);
for (let i = 0; i < 8; i++) box(piston, [0.09, 0.08, 0.45], darkSteel, [-0.12 + i * 0.16, 0.23, 0]);

// molla: ancorata al guidamolla (x = -1.65) e compressa dal pistone
const springGroup = new THREE.Group(); springGroup.position.x = -1.65; gearbox.add(springGroup);
(function () {
  const pts = [], turns = 14, seg = turns * 18, len = 1.55;
  for (let i = 0; i <= seg; i++) { const t = i / seg, a = t * turns * Math.PI * 2; pts.push(new THREE.Vector3(t * len, 0.38 + 0.14 * Math.cos(a), 0.14 * Math.sin(a))); }
  springGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), seg, 0.025, 8, false), mat('#d7e0e8', 0.8, 0.22)));
})();

// ingranaggi (rappresentativi)
function makeGear(radius, teeth, thickness, material, from = 0, to = 1) {
  const g = new THREE.Group();
  cylinder(g, radius * 0.78, thickness, material, [0, 0, 0], 'z', 64);
  for (let i = 0; i < teeth; i++) {
    const f = i / teeth; if (f < from || f > to) continue;
    const a = f * Math.PI * 2;
    const tooth = box(g, [radius * 0.27, radius * 0.17, thickness * 0.82], material, [Math.cos(a) * radius * 0.91, Math.sin(a) * radius * 0.91, 0]);
    tooth.rotation.z = a;
  }
  cylinder(g, radius * 0.18, thickness + 0.04, darkSteel, [0, 0, 0], 'z', 32);
  return g;
}
const bevel = makeGear(0.55, 16, 0.18, brass); bevel.position.set(-1.72, -0.48, 0.32); gearbox.add(bevel);
const spur = makeGear(0.78, 28, 0.18, steel); spur.position.set(-0.72, -0.45, 0.32); gearbox.add(spur);
// il sector ha denti solo su una parte: è il tratto senza denti che "lascia andare" il pistone
const sector = makeGear(0.82, 32, 0.2, blue, 0, 0.45); sector.position.set(0.42, -0.46, 0.32); gearbox.add(sector);

// tappet plate
const tappet = new THREE.Group(); gearbox.add(tappet);
box(tappet, [1.25, 0.09, 0.13], blue, [1.15, 0.68, 0]);
box(tappet, [0.12, 0.42, 0.13], blue, [1.68, 0.48, 0]);

// anti-reversal latch, grilletto/contatti, guidamolla, perni
const latch = new THREE.Group(); gearbox.add(latch);
box(latch, [0.48, 0.12, 0.16], brass, [-1.55, -0.02, 0.52]);
box(latch, [0.12, 0.38, 0.16], brass, [-1.78, 0.13, 0.52]);
box(gearbox, [0.4, 0.35, 0.3], black, [-2.1, -0.55, 0.55]);
box(gearbox, [0.12, 0.48, 0.12], orange, [-2.0, -0.4, 0.74]);
cylinder(gearbox, 0.11, 0.62, steel, [-2.24, 0.38, 0], 'x', 32);
cylinder(gearbox, 0.22, 0.16, brass, [-2.52, 0.38, 0], 'x', 32);
for (const p of [[-1.72, -0.48], [-0.72, -0.45], [0.42, -0.46]]) cylinder(gearbox, 0.12, 0.12, steel, [p[0], p[1], 0.52], 'z', 32);

// ---------- comandi
const fase = document.getElementById('fase');
const playButton = document.getElementById('play'), speedInput = document.getElementById('speed'), phaseInput = document.getElementById('phase');
let playing = true, speed = Number(speedInput.value), phase = 0;
playButton.onclick = () => { playing = !playing; playButton.textContent = playing ? 'Pausa' : 'Play'; };
speedInput.oninput = () => { speed = Number(speedInput.value); };
phaseInput.oninput = () => { phase = Number(phaseInput.value); playing = false; playButton.textContent = 'Play'; };

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const FASI = [
  [0.00, '1. Grilletto premuto: il motore fa girare bevel → spur → sector'],
  [0.06, '2. Il tappet plate tira indietro il nozzle: un pallino entra in camera'],
  [0.40, '3. Il nozzle torna avanti e chiude la camera; il sector continua a caricare la molla'],
  [0.72, '4. Il sector finisce i denti: il pistone viene rilasciato'],
  [0.76, '5. La molla spinge il pistone: l\'aria compressa spara il pallino'],
  [0.88, '6. Fine ciclo: l\'anti-reversal impedisce agli ingranaggi di tornare indietro']
];

function updateMotion(t) {
  // carica lenta (0 → 0,72), rilascio rapido (0,72 → 0,76)
  const back = t < 0.72 ? smooth(0, 0.72, t) : 1 - smooth(0.72, 0.76, t);
  piston.position.x = -0.72 * back;
  springGroup.scale.x = (1.55 - 0.72 * back) / 1.55;
  const nz = smooth(0.06, 0.18, t) - smooth(0.34, 0.46, t);
  tappet.position.x = -0.24 * nz;
  nozzle.position.x = 2.35 - 0.3 * nz;
  // il sector fa un giro per colpo; spur e bevel girano più veloci (ingranaggi a catena)
  const rot = t * Math.PI * 2;
  sector.rotation.z = -rot; spur.rotation.z = rot * 32 / 28; bevel.rotation.z = -rot * 32 / 16;
  latch.rotation.z = 0.12 * Math.abs(Math.sin(rot * 8));
  // pallino: scende in camera, poi parte lungo la canna
  if (t < 0.12) { bb.visible = t > 0.06; bb.position.set(2.8, 0.38 + 0.5 * (1 - smooth(0.06, 0.12, t)), 0); }
  else if (t < 0.76) { bb.visible = true; bb.position.set(2.8, 0.38, 0); }
  else { const k = smooth(0.76, 0.86, t); bb.visible = k < 1; bb.position.set(2.8 + 3.6 * k, 0.38, 0); }
  let txt = FASI[0][1]; for (const f of FASI) if (t >= f[0]) txt = f[1];
  fase.textContent = txt;
}

function fit() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
function placeCamera() {
  // inquadra tutto il gruppo (circa 9,5 unità di larghezza) anche sul telefono in verticale
  const d = Math.max(8.5, 9.5 / (0.768 * camera.aspect));
  camera.position.set(1.8, 2.4 * d / 9, d);
}
fit(); placeCamera();
addEventListener('resize', fit);

function animate() {
  requestAnimationFrame(animate);
  if (playing) { phase = (phase + 0.0025 * speed) % 1; phaseInput.value = String(phase); }
  updateMotion(phase);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
