<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="420" rx="16" fill="#f3eee1"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#1e1e1a">Come funziona</text>
  <rect x="80" y="70" width="460" height="10" fill="#8b8676"/>
  <rect x="80" y="122" width="460" height="10" fill="#8b8676"/>
