  <g font-size="14" fill="#1e1e1a">
    <text x="190" y="54">gommino (bucking) e nub</text>
    <text x="300" y="92">direzione del pallino</text>
    <text x="80" y="156">Il nub preme sopra il pallino: gira all'indietro (backspin)</text><text x="80" y="174">e così "galleggia" più a lungo invece di cadere subito.</text>
  </g>
  <line x1="30" y1="190" x2="610" y2="185" stroke="#c9c1aa" stroke-width="2"/>
  <text x="30" y="214" font-size="18" font-weight="700" fill="#1e1e1a">Regolazione (stesso peso di pallino che usi in gioco)</text>
  <line x1="40" y1="390" x2="610" y2="390" stroke="#5a5444" stroke-width="2"/>
  <rect x="34" y="312" width="22" height="12" fill="#1e1e1a"/>
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M56 318 Q300 230 470 230" stroke="#b3261e" stroke-dasharray="10 7"/>
    <path d="M56 318 Q330 304 600 326" stroke="#2d6a3e"/>
    <path d="M56 318 Q200 330 330 388" stroke="#b3261e" stroke-dasharray="3 7"/>
  </g>
  <g font-size="15" font-weight="700">
    <text x="478" y="236" fill="#b3261e">troppo hop-up: sale</text>
    <text x="440" y="300" fill="#2d6a3e">giusto: tiro piatto e lungo</text>
    <text x="340" y="378" fill="#b3261e">poco hop-up: cade</text>
  </g>
