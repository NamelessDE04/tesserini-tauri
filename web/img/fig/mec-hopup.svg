  <circle cx="225" cy="103" r="18" fill="#fff" stroke="#1e1e1a" stroke-width="2.5"/>
  <path d="M240 92 A20 20 0 0 0 208 92" fill="none" stroke="#b3261e" stroke-width="3"/>
  <path d="M208 92 l1 -11 l9 6z" fill="#b3261e"/>
  <path d="M300 101 H420" stroke="#1e1e1a" stroke-width="3"/>
