<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="310" rx="16" fill="#f3eee1"/>
  <defs>
    <g id="piede"><ellipse cx="0" cy="0" rx="13" ry="24" /><ellipse cx="0" cy="-34" rx="10" ry="8"/></g>
  </defs>
  <g transform="translate(0,0)">
    <g fill="#9a937f"><use href="#piede" x="70" y="110" transform="rotate(90 70 110)"/><use href="#piede" x="230" y="110" transform="rotate(90 230 110)"/><use href="#piede" x="390" y="110" transform="rotate(90 390 110)"/><use href="#piede" x="550" y="110" transform="rotate(90 550 110)"/></g>
    <g fill="#1f4f8f"><use href="#piede" x="150" y="160" transform="rotate(90 150 160)"/><use href="#piede" x="310" y="160" transform="rotate(90 310 160)"/><use href="#piede" x="470" y="160" transform="rotate(90 470 160)"/></g>
  </g>
  <g font-size="22" font-weight="700" fill="#fff" text-anchor="middle"><text x="152" y="168">1</text><text x="312" y="168">2</text><text x="472" y="168">3</text></g>
  <g stroke="#b3261e" stroke-width="2.5" fill="none"><path d="M150 200 V214 H310 V200"/></g>
  <text x="230" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#b3261e">1 passo doppio</text>
  <g font-size="15" fill="#1e1e1a">
    <text x="30" y="48"><tspan fill="#9a937f" font-weight="700">■ piede sinistro</tspan>   <tspan fill="#1f4f8f" font-weight="700">■ piede destro</tspan>: si conta solo quando tocca terra il destro</text>
    <text x="30" y="262">Taratura: conta i passi doppi su 100 m misurati</text><text x="30" y="284">(in piano di solito 60–70) e ripeti la prova in salita.</text>
  </g>
  <text x="610" y="140" text-anchor="end" font-size="26" fill="#5a5444">→</text>
