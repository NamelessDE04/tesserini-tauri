<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 384" font-family="Arial, Helvetica, sans-serif">
  <rect width="680" height="384" rx="16" fill="#f3eee1"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#1e1e1a">Messa in sicurezza, sempre in quest'ordine</text>
  <g font-size="14" fill="#1e1e1a" text-anchor="middle">
    <g transform="translate(95,130)">
      <circle r="52" fill="#fff" stroke="#1e1e1a" stroke-width="2.5"/>
      <rect x="-26" y="-12" width="52" height="24" rx="12" fill="#2d6a3e"/><circle cx="-12" cy="0" r="9" fill="#fff"/>
      <text y="38" font-size="12" font-weight="700" fill="#2d6a3e">SAFE</text>
      <text y="80" font-weight="700">1. Sicura</text><text y="98">inserita</text>
    </g>
    <g transform="translate(255,130)">
      <circle r="52" fill="#fff" stroke="#1e1e1a" stroke-width="2.5"/>
      <path d="M-12 -30 h24 l6 44 h-26z" fill="#5a5444"/>
      <path d="M0 20 v20 M-8 32 l8 8 l8 -8" stroke="#b3261e" stroke-width="3" fill="none"/>
      <text y="80" font-weight="700">2. Caricatore</text><text y="98">tolto</text>
    </g>
    <g transform="translate(415,130)">
      <circle r="52" fill="#fff" stroke="#1e1e1a" stroke-width="2.5"/>
      <rect x="-28" y="-14" width="46" height="28" rx="4" fill="#1f4f8f"/><rect x="18" y="-6" width="6" height="12" fill="#1f4f8f"/>
      <path d="M-28 0 h-10" stroke="#1e1e1a" stroke-width="3"/>
      <path d="M-40 -22 l-10 44" stroke="#b3261e" stroke-width="3"/>
      <text y="80" font-weight="700">3. Batteria</text><text y="98">scollegata</text>
    </g>
    <g transform="translate(575,130)">
      <circle r="52" fill="#fff" stroke="#1e1e1a" stroke-width="2.5"/>
      <path d="M-34 -8 h50 v8 h12 v-4 h8 v10 h-20 v6 h-14 l-6 16 h-10 l4 -16 h-24z" fill="#1e1e1a"/>
      <path d="M26 -20 l12 -6 M28 -8 l14 0" stroke="#b3261e" stroke-width="2.5"/>
      <text y="80" font-weight="700">4. Colpo a vuoto</text><text y="98">in direzione sicura</text>
    </g>
  </g>
  <line x1="30" y1="255" x2="650" y2="255" stroke="#c9c1aa" stroke-width="2"/>
  <g font-size="17" fill="#1e1e1a">
    <text x="30" y="290" font-weight="700">Energia alla volata: E = ½ · m · v²</text>
    <text x="30" y="318">pallino da 0,20 g a 100 m/s → ½ × 0,0002 kg × 100² = <tspan font-weight="700">1,0 J</tspan></text>
    <text x="30" y="344" font-size="15" fill="#5a5444">In Italia il limite è 1 joule; molti campi chiedono valori più bassi.</text><text x="30" y="366" font-size="15" fill="#b3261e" font-weight="700">Occhiali di protezione sempre, anche al banco.</text>
  </g>
</svg>
