<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="380" rx="16" fill="#f3eee1"/>
  <text x="160" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1a">Scala 1:25.000</text>
  <g transform="translate(40,110)">
    <rect x="0" y="0" width="60" height="18" fill="#1e1e1a"/>
    <rect x="60" y="0" width="60" height="18" fill="#fff" stroke="#1e1e1a" stroke-width="2"/>
    <rect x="120" y="0" width="60" height="18" fill="#1e1e1a"/>
    <rect x="180" y="0" width="60" height="18" fill="#fff" stroke="#1e1e1a" stroke-width="2"/>
    <g font-size="14" fill="#1e1e1a" text-anchor="middle">
      <text x="0" y="40">0</text><text x="60" y="40">250</text><text x="120" y="40">500</text><text x="180" y="40">750</text><text x="240" y="40">1 km</text>
    </g>
    <g stroke="#b3261e" stroke-width="2" fill="none"><path d="M0 -14 V-24 H60 V-14"/></g>
    <text x="30" y="-30" text-anchor="middle" font-size="14" fill="#b3261e" font-weight="700">1 cm</text>
  </g>
  <g font-size="17" fill="#1e1e1a">
    <text x="40" y="215">1 cm sulla carta = <tspan font-weight="700">250 m</tspan></text>
    <text x="40" y="245">4 cm sulla carta = <tspan font-weight="700">1 km</tspan></text>
    <text x="40" y="290" font-size="15" fill="#5a5444">Esempio: 6 cm sulla carta</text>
    <text x="40" y="312" font-size="15" fill="#5a5444">= 6 × 250 m = 1,5 km</text>
  </g>
  <line x1="300" y1="30" x2="300" y2="350" stroke="#c9c1aa" stroke-width="2"/>
  <text x="470" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1e1a">Curve di livello</text>
  <g fill="none" stroke="#8a5a2b" stroke-width="2.4">
    <ellipse cx="470" cy="205" rx="140" ry="115"/>
    <ellipse cx="456" cy="205" rx="116" ry="94"/>
    <ellipse cx="442" cy="205" rx="92" ry="73"/>
    <ellipse cx="428" cy="205" rx="68" ry="53"/>
    <ellipse cx="414" cy="205" rx="44" ry="34"/>
  </g>
  <path d="M404 210 l9 -16 l9 16z" fill="#1e1e1a"/>
  <text x="413" y="232" text-anchor="middle" font-size="13" fill="#1e1e1a">cima</text>
  <g font-size="14" font-weight="700">
    <text x="318" y="345" fill="#b3261e">curve vicine = pendio ripido</text>
    <text x="318" y="366" fill="#2d6a3e">curve larghe = pendio dolce</text>
  </g>
</svg>
